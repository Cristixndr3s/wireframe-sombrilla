<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Wireframe · Marca sombrilla RappiPay</title>
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <div class="notice" role="note">
    Wireframe interno de arquitectura de información · No es un sitio oficial · Textos y cifras de ejemplo
    <label class="notice__toggle"><input type="checkbox" id="toggle-notes" checked> Mostrar anotaciones</label>
  </div>

  <header class="header">
    <div class="bar">
      <a href="#inicio" class="logo" aria-label="Inicio">Logo RappiPay</a>
      <nav class="nav" aria-label="Menú principal">
        <ul class="nav__list" id="nav-list"></ul>
      </nav>
      <a href="#perdida-o-robo" class="btn btn--ghost lost" aria-label="Reportar pérdida o robo">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
        <span class="lost__text">Pérdida o robo</span>
      </a>
      <button type="button" class="btn btn--primary header__cta" id="header-cta" title="En el sitio real lleva a la app o al onboarding">Abrir RappiCuenta</button>
      <button class="burger" id="burger" aria-label="Abrir menú" aria-expanded="false" aria-controls="drawer">☰</button>
    </div>
    <div class="mega" id="mega" hidden></div>
  </header>

  <div class="drawer" id="drawer" hidden>
    <div class="drawer__head">
      <button class="drawer__back" id="drawer-back" hidden>‹ Volver</button>
      <button class="drawer__close" id="drawer-close" aria-label="Cerrar menú">✕</button>
    </div>
    <a href="#perdida-o-robo" class="drawer__urgent">Reportar pérdida o robo</a>
    <div class="drawer__body" id="drawer-body"></div>
  </div>

  <main id="app"></main>

  <script src="data.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
